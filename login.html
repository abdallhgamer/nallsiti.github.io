<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورود کاربران</title>
<style>
body{background:#0b1020;color:white;font-family:Tahoma;text-align:center;padding:30px}
.box{background:#171f3b;padding:25px;border-radius:15px;max-width:400px;margin:50px auto}
input{width:90%;padding:12px;margin:10px;background:#0b1020;color:white;border:1px solid #555;border-radius:8px}
button{padding:12px 25px;background:#805cff;color:white;border:0;border-radius:8px}
</style>
</head>
<body>
<div class="box">
<h2>👑 ورود به سایت‌ساز</h2>
<input id="username" placeholder="نام کاربری">
<input id="password" type="password" placeholder="رمز عبور">
<button onclick="login()">ورود</button>
<p id="message"></p>
</div>
<script>
function login(){
let u=document.getElementById('username').value.trim();
let p=document.getElementById('password').value;
if(!u||!p){
document.getElementById('message').textContent='همه فیلدها را پر کن';
return;
}
document.getElementById('message').textContent=
'این صفحه هنوز به سیستم حساب کاربری امن متصل نشده است.';
}
</script>
</body>
</html>
