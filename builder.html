<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سایت‌ساز عبدالله گیمر</title>
<style>
body{background:#0b1020;color:white;font-family:Tahoma;margin:0}
header{padding:20px;background:#171f3b;text-align:center}
main{max-width:900px;margin:auto;padding:15px}
.box{background:#171f3b;padding:20px;border-radius:15px;margin-bottom:15px}
input,textarea{width:100%;padding:12px;margin:8px 0;box-sizing:border-box;background:#0b1020;color:white;border:1px solid #555;border-radius:8px}
button{background:#805cff;color:white;border:0;padding:12px;border-radius:8px;margin:5px}
iframe{width:100%;height:400px;background:white;border:0;border-radius:10px}
</style>
</head>
<body>
<header>
<h2>👑 ABDOLLAH GAMER BUILDER</h2>
<p>سایت خودت را طراحی کن</p>
</header>
<main>
<div class="box">
<h3>مشخصات سایت</h3>
<input id="name" placeholder="نام سایت">
<input id="address" placeholder="نام فایل انگلیسی، مثل ali">
<textarea id="description" placeholder="توضیحات سایت"></textarea>
<input id="photo" type="file" accept="image/*">
<input id="bg" type="color" value="#10152b">
<button onclick="preview()">پیش‌نمایش</button>
<button onclick="downloadSite()">دانلود سایت HTML</button>
<button onclick="saveProject()">ذخیره JSON</button>
<button onclick="document.getElementById('load').click()">بازکردن پروژه</button>
<input type="file" id="load" accept=".json" hidden>
</div>
<div class="box">
<h3>پیش‌نمایش سایت</h3>
<iframe id="view" sandbox></iframe>
</div>
<div class="box">
<h3>انتشار</h3>
<p>نام فایل انتخابی:</p>
<strong id="result">my-site.html</strong>
<p>برای انتشار، فایل HTML را در مخزن میزبانی خود آپلود کن.</p>
</div>
</main>
<script>
let imageData='';

function getFileName(){
return (document.getElementById('address').value||'my-site')
.replace(/[^a-zA-Z0-9_-]/g,'-')+'.html';
}

function escapeHTML(s){
return String(s).replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
}

function makeHTML(){
let name=escapeHTML(document.getElementById('name').value||'سایت من');
let desc=escapeHTML(document.getElementById('description').value||'به سایت من خوش آمدید');
let bg=document.getElementById('bg').value;
return `<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${name}</title>
<style>
body{background:${bg};color:white;text-align:center;font-family:Tahoma;padding:30px}
img{max-width:100%;max-height:300px;border-radius:15px}
</style>
</head>
<body>
<h1>${name}</h1>
${imageData?'<img src="'+imageData+'" alt="تصویر سایت">':''}
<p>${desc}</p>
</body>
</html>`;
}

function preview(){
let html=makeHTML();
document.getElementById('view').srcdoc=html;
document.getElementById('result').textContent=getFileName();
}

function downloadSite(){
let blob=new Blob([makeHTML()],{type:'text/html;charset=utf-8'});
let a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download=getFileName();
a.click();
URL.revokeObjectURL(a.href);
}

function saveProject(){
let data={
name:document.getElementById('name').value,
address:document.getElementById('address').value,
description:document.getElementById('description').value,
bg:document.getElementById('bg').value,
image:imageData
};
let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
let a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='project.json';
a.click();
URL.revokeObjectURL(a.href);
}

document.getElementById('photo').onchange=e=>{
let f=e.target.files[0];
if(!f)return;
if(!f.type.startsWith('image/')||f.size>2*1024*1024){
alert('عکس باید کمتر از ۲ مگابایت باشد');
return;
}
let r=new FileReader();
r.onload=()=>{imageData=r.result;preview()};
r.readAsDataURL(f);
};

document.getElementById('load').onchange=async e=>{
let f=e.target.files[0];
if(!f)return;
try{
let d=JSON.parse(await f.text());
document.getElementById('name').value=d.name||'';
document.getElementById('address').value=d.address||'';
document.getElementById('description').value=d.description||'';
document.getElementById('bg').value=d.bg||'#10152b';
imageData=d.image||'';
preview();
}catch(err){alert('فایل JSON معتبر نیست')}
};

preview();
</script>
</body>
</html>
